    func: !!python/name:mjlab.envs.mdp.terminations.time_out ''
    params: {}
    time_out: true
  fell_over:
    func: !!python/name:mjlab.envs.mdp.terminations.bad_orientation ''
    params:
      limit_angle: 1.2217304763960306
    time_out: false
  root_height:
    func: !!python/name:mjlab.envs.mdp.terminations.root_height_below_minimum ''
    params:
      minimum_height: 0.4
    time_out: false
  nan_term:
    func: !!python/name:mjlab.envs.mdp.terminations.nan_detection ''
    params: {}
    time_out: false
commands:
  twist:
    resampling_time_range: !!python/tuple
    - 3.0
    - 6.0
    debug_vis: true
    entity_name: robot
    heading_command: false
    heading_control_stiffness: 0.5
    rel_standing_envs: 0.12
    rel_heading_envs: 1.0
    rel_world_envs: 0.0
    rel_forward_envs: 0.0
    init_velocity_prob: 0.0
    ranges:
      lin_vel_x: !!python/tuple
      - 0.15
      - 0.6
      lin_vel_y: !!python/tuple
      - 0.0
      - 0.0
      ang_vel_z: !!python/tuple
      - 0.0
      - 0.0
      heading: null
    viz:
      z_offset: 1.15
      scale: 0.5
curriculum:
  command_vel:
    func: !!python/name:src.tasks.velocity.mdp.curriculums.commands_vel ''
    params:
      command_name: twist
      velocity_stages:
      - step: 0
        lin_vel_x: !!python/tuple
        - 0.15
        - 0.6
        lin_vel_y: !!python/tuple
        - 0.0
        - 0.0
        ang_vel_z: !!python/tuple
        - 0.0
        - 0.0
  parametric_alpha:
    func: !!python/name:__main__.parametric_alpha_curriculum ''
    params:
      action_name: joint_pos
      alpha_stages:
      - step: 0
        alpha: 0.55
  parametric_frequency:
    func: !!python/name:__main__.parametric_frequency_curriculum ''
    params:
      action_name: joint_pos
      frequency_stages:
      - step: 0
        min_frequency: 0.8
        max_frequency: 1.1
